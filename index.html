<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02060a">
<title>NAVI-ZETE v105</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>
:root{
  --c:#00d4ff;
  --g:#00ff78;
  --r:#ff5f70;
  --a:#ffb347;
  --glass:#06111be8;
  --line:#405665;
  --txt:#eefbff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  user-select:none;
}

button,input{
  font:inherit;
  color:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  filter:brightness(1.16);
}

button.busy{
  opacity:.62;
  pointer-events:none;
}

.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#02060a;
}

.main{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
}

.maplibregl-ctrl-attrib{
  display:none!important;
}

#mapNightTint{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  opacity:0;
  transition:.25s;
  background:radial-gradient(
    circle at 50% 40%,
    rgba(0,22,26,.02),
    rgba(0,0,0,.33)
  );
  mix-blend-mode:multiply;
}

.night-ui #mapNightTint{
  opacity:1;
}

.vehicle{
  width:50px;
  height:50px;
  filter:drop-shadow(0 5px 6px #000b);
}

.vehicle svg{
  width:100%;
  height:100%;
}

.dest{
  width:27px;
  height:27px;
  border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  background:var(--c);
  border:3px solid #fff;
  box-shadow:0 0 16px #00d4ff99;
}

.top{
  position:absolute;
  z-index:20;
  left:16px;
  right:16px;
  top:max(12px,env(safe-area-inset-top));
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.hud,
.tool,
.state,
.status{
  background:var(--glass);
  border:1px solid var(--line);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  box-shadow:0 8px 22px #0009;
}

.hud{
  border-left:4px solid var(--g);
  border-radius:8px;
  padding:9px 12px;
  font:800 11px/1.5 ui-monospace,monospace;
}

.hud b{
  font-size:14px;
}

.time{
  font:800 36px/1 Orbitron,monospace;
  letter-spacing:3px;
  padding:9px 15px;
  border:1px solid #7defff;
  border-radius:11px;
  background:linear-gradient(#071522,#010407);
  text-shadow:
    0 0 3px #fff,
    0 0 15px #00d4ff;
  box-shadow:
    0 0 8px #bff7ff,
    0 0 28px #00d4ff88,
    inset 0 0 14px #00d4ff44;
  position:relative;
  overflow:hidden;
}

.time:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    105deg,
    transparent 25%,
    #fff3 45%,
    transparent 62%
  );
  transform:translateX(-140%);
  animation:sweep 3.6s ease-in-out infinite;
}

@keyframes sweep{
  0%,60%{
    transform:translateX(-140%);
  }

  85%,100%{
    transform:translateX(140%);
  }
}

.tools{
  position:absolute;
  z-index:21;
  left:16px;
  top:142px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.tool{
  min-width:132px;
  padding:11px 12px;
  border-radius:8px;
  font-weight:900;
}

.tool.on{
  color:var(--c);
  border-color:var(--c);
  box-shadow:0 0 13px #00d4ff44;
}

.cancel-guide{
  display:none;
  color:#ff8792;
  border-color:#98333e;
  background:linear-gradient(#351117,#140407);
}

.cancel-guide.show{
  display:block;
}

.states{
  position:absolute;
  z-index:21;
  right:16px;
  top:76px;
  display:flex;
  flex-direction:column;
  gap:5px;
  align-items:flex-end;
}

.state{
  padding:5px 8px;
  border-radius:4px;
  font:800 9px/1 Orbitron,monospace;
  letter-spacing:.7px;
}

.state.ok{
  color:var(--g);
  border-color:#187d50;
}

.state.warn{
  color:var(--a);
  border-color:#8f6728;
}

.status{
  position:absolute;
  z-index:22;
  top:17px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  border-radius:8px;
  padding:8px 13px;
  font-weight:800;
}

.status.show{
  display:block;
}

.status b{
  color:var(--c);
}

.guide{
  position:absolute;
  z-index:22;
  right:-340px;
  top:0;
  width:320px;
  height:100%;
  background:linear-gradient(#07182a,#02070d);
  border-left:2px solid var(--c);
  padding:16px 13px;
  display:flex;
  flex-direction:column;
  gap:10px;
  transition:.25s;
  box-shadow:-10px 0 25px #000b;
}

.guide.show{
  right:0;
}

.sign{
  border:2px solid var(--c);
  border-radius:8px;
  background:linear-gradient(#00375f,#001522);
  text-align:center;
  padding:10px;
}

.arrow{
  font-size:58px;
}

.gtext{
  font-size:17px;
  font-weight:900;
}

.road3d{
  flex:1;
  border:1px solid #344754;
  border-radius:8px;
  background:linear-gradient(
    #172d45 0 38%,
    #444 38%,
    #171717 100%
  );
  position:relative;
  overflow:hidden;
}

.road3d:after{
  content:"";
  position:absolute;
  left:50%;
  top:44%;
  bottom:-20px;
  width:4px;
  background:repeating-linear-gradient(
    #fff 0 18px,
    transparent 18px 34px
  );
}

.gdist{
  text-align:center;
  background:#000b;
  border:1px solid #34444e;
  border-radius:8px;
  padding:9px;
}

.gdist b{
  font-size:29px;
}

/* ===== 下段・左右対称 ===== */

.bottom{
  height:96px;
  flex:0 0 96px;
  z-index:30;
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);
  gap:12px;
  align-items:center;
  padding:7px 11px max(7px,env(safe-area-inset-bottom));
  background:repeating-linear-gradient(
    45deg,
    #101010 0 6px,
    #171717 6px 12px
  );
  border-top:2px solid #000;
  box-shadow:0 -8px 24px #000;
}

.grp.left,
.grp.right{
  width:100%;
  display:grid;
  grid-template-columns:minmax(108px,1.25fr) repeat(3,minmax(58px,.72fr));
  gap:8px;
  align-items:center;
}

.grp.right{
  grid-template-columns:repeat(3,minmax(58px,.72fr)) minmax(108px,1.25fr);
}

.badge{
  height:39px;
  width:100%;
  padding:0 8px;
  display:grid;
  place-items:center;
  background:linear-gradient(#3c3c3c,#111);
  border:1px solid #595959;
  border-radius:5px;
  font:700 9px/1 Georgia;
  letter-spacing:2px;
  white-space:nowrap;
}

.hw{
  width:100%;
  height:56px;
  min-width:0;
  border:1px solid #090909;
  border-top:2px solid #777;
  border-bottom:4px solid #000;
  border-radius:7px;
  background:linear-gradient(
    #575757,
    #252525 48%,
    #101010
  );
  box-shadow:0 8px 15px #000b;
  font-weight:900;
  font-size:16px;
  position:relative;
}

.hw:after{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  height:3px;
  bottom:-3px;
  background:var(--c);
  box-shadow:0 0 10px var(--c);
}

/* ===== 腕時計 ===== */

.analog{
  width:84px;
  height:84px;
  border:0;
  padding:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(
    145deg,
    #edf3f8,
    #8f9aa4 35%,
    #4e5861 55%,
    #d8e0e6
  );
  box-shadow:
    inset 0 0 0 1px #fff8,
    inset 0 0 0 3px #69737d,
    0 8px 18px #000d;
  overflow:hidden;
}

.watch{
  position:relative;
  width:76px;
  height:76px;
  border-radius:50%;
  background:radial-gradient(
    circle at 50% 34%,
    #2863be,
    #113d8e 30%,
    #09182e 58%,
    #03070d
  );
  box-shadow:
    inset 0 0 0 2px #0b0e12,
    inset 0 0 15px #000;
}

.watch:before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:conic-gradient(
    #08090c 0 145deg,
    #1456c9 145deg 220deg,
    #08090c 220deg
  );
  -webkit-mask:radial-gradient(
    farthest-side,
    transparent calc(100% - 12px),
    #000 calc(100% - 11px)
  );
  mask:radial-gradient(
    farthest-side,
    transparent calc(100% - 12px),
    #000 calc(100% - 11px)
  );
}

.watch-logo{
  position:absolute;
  top:17px;
  left:0;
  right:0;
  text-align:center;
  font:700 6px/1 Orbitron;
  color:#fff;
  letter-spacing:.8px;
  z-index:3;
}

.watch-sub{
  position:absolute;
  top:25px;
  left:0;
  right:0;
  text-align:center;
  font:600 4px/1 Orbitron;
  color:#d8ecff;
  z-index:3;
}

.marks span{
  position:absolute;
  left:50%;
  top:50%;
  width:3px;
  height:11px;
  border-radius:4px;
  background:#eaf2f8;
  transform:
    translate(-50%,-50%)
    rotate(var(--r))
    translateY(-24px);
  z-index:2;
}

.marks .big{
  width:4px;
  height:14px;
}

.subdial{
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:radial-gradient(
    circle at 35% 30%,
    #555,
    #171a1e 50%,
    #08090b
  );
  box-shadow:
    inset 0 0 0 1px #81888e88,
    inset 0 0 7px #000;
  z-index:2;
}

.sd1{
  left:10px;
  top:29px;
}

.sd2{
  right:10px;
  top:29px;
}

.sd3{
  left:29px;
  bottom:8px;
}

.subdial:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:1px;
  height:6px;
  background:#e9f2f8;
  transform:
    translate(-50%,-100%)
    rotate(25deg);
  transform-origin:50% 100%;
}

.hand{
  position:absolute;
  left:50%;
  bottom:50%;
  transform-origin:bottom center;
  z-index:4;
  border-radius:3px;
}

.hh{
  width:4px;
  height:19px;
  background:#eaf2f8;
}

.mh{
  width:3px;
  height:27px;
  background:#f7fbff;
}

.sh{
  width:1.5px;
  height:30px;
  background:#e51e43;
}

.center-dot{
  position:absolute;
  left:50%;
  top:50%;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#eaf2f8;
  transform:translate(-50%,-50%);
  z-index:5;
}

/* ===== モーダル ===== */

.modal{
  position:fixed;
  z-index:100;
  inset:9% 5% 14%;
  display:none;
  flex-direction:column;
  background:linear-gradient(
    145deg,
    #14222d,
    #04070b
  );
  border:2px solid #3f5667;
  border-radius:11px;
  padding:20px;
  overflow:auto;
  box-shadow:0 25px 60px #000e;
}

.modal.show{
  display:flex;
}

.modal h2{
  margin:0 0 14px;
  padding-bottom:10px;
  border-bottom:2px solid var(--c);
}

.search{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.search input{
  flex:1;
  min-width:0;
  padding:12px;
  background:#0d151c;
  border:1px solid #4f6676;
  border-radius:7px;
}

.primary{
  border:0;
  background:var(--c);
  color:#00151d;
  border-radius:7px;
  padding:0 17px;
  font-weight:900;
}

.search-state{
  display:none;
  margin:-2px 0 10px;
  padding:8px 10px;
  border-left:3px solid var(--c);
  background:#061018;
  color:#bfefff;
  font-size:11px;
  border-radius:4px;
}

.search-state.show{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:12px;
}

.cat,
.setting,
.row{
  border:1px solid #455967;
  background:#17222b;
  border-radius:8px;
  padding:12px;
  font-weight:800;
}

.setting{
  text-align:left;
  margin-bottom:8px;
}

.setting strong{
  color:var(--c);
}

.home-state{
  font-size:11px;
  color:#9fb0bc;
}

.home-state.ready{
  color:var(--g);
}

.row{
  width:100%;
  display:flex;
  justify-content:space-between;
  gap:8px;
  text-align:left;
}

.row small{
  display:block;
  color:#a9b7c1;
  margin-top:4px;
}

.row .dist{
  color:#7de7ff;
  white-space:nowrap;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:14px;
}

.danger{
  margin-top:auto;
  padding:13px;
  border:1px solid #df5364;
  background:linear-gradient(#7e1824,#43070e);
  border-radius:7px;
  font-weight:900;
}

.note{
  font-size:11px;
  color:#cdb68c;
  background:#201508;
  border-left:3px solid var(--a);
  padding:8px;
  margin:1px 0 10px;
}

/* ===== ルートプレビュー ===== */

.preview{
  position:fixed;
  z-index:90;
  left:0;
  right:0;
  bottom:-560px;
  background:linear-gradient(#12212d,#04070b);
  border-top:3px solid var(--c);
  padding:13px 17px calc(13px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 35px #000d;
  transition:.3s;
}

.preview.show{
  bottom:96px;
}

.ptitle{
  text-align:center;
  font-size:17px;
  font-weight:900;
  margin-bottom:8px;
}

.routes{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.route{
  border:1px solid #4d6271;
  background:#16212a;
  border-radius:7px;
  padding:9px 4px;
  font-weight:900;
  font-size:12px;
}

.route.on{
  background:var(--c);
  color:#00151d;
}

.pinfo{
  margin:9px 0;
  background:#000b;
  border:1px solid #34444f;
  border-radius:7px;
  padding:10px;
  text-align:center;
}

.acts{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:8px;
}

.acts button{
  padding:12px;
  border-radius:7px;
  font-weight:900;
}

.cancel{
  background:#3e474d;
  border:1px solid #66727b;
}

.start{
  background:var(--c);
  color:#00151d;
  border:0;
}

/* ===== トースト ===== */

#toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:111px;
  transform:translate(-50%,10px);
  opacity:0;
  visibility:hidden;
  transition:.2s;
  background:#000e;
  border:1px solid var(--c);
  border-radius:8px;
  padding:12px 16px;
  min-width:260px;
  max-width:86vw;
  text-align:center;
  font-weight:800;
}

#toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}

/* ===== 高速道路画面 ===== */

.highway-view{
  position:absolute;
  z-index:18;
  right:0;
  top:0;
  bottom:0;
  width:48%;
  overflow:hidden;
  transform:translateX(105%);
  opacity:0;
  transition:.35s;
  background:linear-gradient(
    #68bce8 0,
    #a7ddf4 34%,
    #83b95c 34%,
    #5f833d 100%
  );
  border-left:2px solid #152733;
  box-shadow:-12px 0 28px #0009;
  pointer-events:none;
}

.highway-view.show{
  transform:translateX(0);
  opacity:1;
}

.hv-road{
  position:absolute;
  left:50%;
  bottom:-10%;
  width:82%;
  height:72%;
  transform:translateX(-50%);
  clip-path:polygon(
    43% 0,
    57% 0,
    100% 100%,
    0 100%
  );
  background:linear-gradient(
    90deg,
    #343638,
    #555 18%,
    #484b4e 50%,
    #555 82%,
    #343638
  );
}

.hv-road:after{
  content:"";
  position:absolute;
  left:49.5%;
  top:0;
  bottom:0;
  width:3px;
  background:repeating-linear-gradient(
    #fff 0 22px,
    transparent 22px 48px
  );
}

.hv-route{
  position:absolute;
  left:50%;
  bottom:1%;
  width:12%;
  height:52%;
  transform:translateX(-50%);
  clip-path:polygon(
    47% 0,
    53% 0,
    80% 100%,
    20% 100%
  );
  background:#0c86ff;
  filter:drop-shadow(0 0 6px #008cff);
}

.hv-sign{
  position:absolute;
  z-index:4;
  left:50%;
  top:12%;
  transform:translateX(-50%);
  width:74%;
  min-height:110px;
  background:linear-gradient(#128f4d,#08703c);
  border:3px solid #effff4;
  box-shadow:0 8px 16px #0007;
  color:#fff;
  display:grid;
  grid-template-columns:70px 1fr;
  align-items:center;
  padding:10px 13px;
}

.hv-arrow{
  font:900 58px/1 Arial;
  text-align:center;
}

.hv-ref{
  display:inline-block;
  border:1px solid #fff;
  border-radius:3px;
  padding:2px 5px;
  font:800 10px Orbitron;
}

.hv-name{
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.hv-dest{
  font-size:11px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.hv-bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:5;
  height:62px;
  background:linear-gradient(
    transparent,
    #02060bea 25%,
    #020406
  );
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:11px;
  font-weight:800;
}

.hv-bottom b{
  font:800 26px Orbitron;
}

.highway-active .guide{
  right:-350px!important;
}

.highway-active .status{
  left:25%;
}

.night-ui .highway-view{
  filter:brightness(.72) saturate(.82);
}

/* ===== OP ===== */

.startup{
  position:fixed;
  z-index:999;
  inset:0;
  background:#000;
  display:block;
  transition:.7s;
  overflow:hidden;
}

.startup.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.startup #opVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
  z-index:1;
}

.op-skip,
.op-retry{
  position:absolute;
  z-index:3;
  border:1px solid #ffffff55;
  background:#05080dcc;
  color:#fff;
  border-radius:999px;
  font:700 11px/1 Orbitron,sans-serif;
  letter-spacing:1px;
  backdrop-filter:blur(7px);
}

.op-skip{
  right:max(18px,env(safe-area-inset-right));
  bottom:max(18px,env(safe-area-inset-bottom));
  padding:10px 14px;
  opacity:.62;
}

.op-retry{
  display:none;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:13px 18px;
  border-color:#00d4ffaa;
  box-shadow:0 0 18px #00d4ff55;
}

.op-retry.show{
  display:block;
}

@media(max-width:900px){

  .bottom{

/* =========================================================
   ボタン音
   ========================================================= */

function bindButtonSound(){

  document.addEventListener(

    'pointerdown',

    e=>{

      const b =
        e.target.closest(
          'button'
        );


      if(
        !b
        ||
        b.disabled
      ){

        return;

      }


      playButtonSound();

    },

    {
      capture:true,
      passive:true
    }

  );

}


function playButtonSound(){

  if(
    Date.now() -
    lastBeep <
    55
  ){

    return;

  }


  lastBeep =
    Date.now();


  try{

    const AC =
      window.AudioContext
      ||
      window.webkitAudioContext;


    if(!AC){
      return;
    }


    audioCtx =
      audioCtx
      ||
      new AC();


    const play = ()=>{

      const t =
        audioCtx.currentTime;


      const o =
        audioCtx.createOscillator();


      const g =
        audioCtx.createGain();


      o.type =
        'square';


      o.frequency.setValueAtTime(
        920,
        t
      );


      o.frequency.exponentialRampToValueAtTime(
        520,
        t + .038
      );


      g.gain.setValueAtTime(
        .10,
        t
      );


      g.gain.exponentialRampToValueAtTime(
        .001,
        t + .052
      );


      o.connect(g);

      g.connect(
        audioCtx.destination
      );


      o.start(t);

      o.stop(
        t + .055
      );

    };


    if(
      audioCtx.state ===
      'suspended'
    ){

      audioCtx
        .resume()
        .then(play)
        .catch(()=>{});

    }else{

      play();

    }

  }catch(_){}

}


/* =========================================================
   OP
   ========================================================= */

function initOpening(){

  const wrap =
    $('startup');


  const video =
    $('opVideo');


  const retry =
    $('opRetry');


  const skip =
    $('opSkip');


  if(
    !wrap
    ||
    !video
  ){

    return;

  }


  let closed =
    false;


  const close =
    ()=>{

      if(closed){
        return;
      }


      closed =
        true;


      try{
        video.pause();
      }catch(_){}


      wrap
        .classList
        .add(
          'hide'
        );

    };


  skip
    ?.addEventListener(
      'click',
      e=>{

        e.stopPropagation();

        close();

      }
    );


  video
    .addEventListener(
      'ended',
      close,
      {
        once:true
      }
    );


  video
    .addEventListener(
      'error',
      ()=>{

        retry.textContent =
          'OP動画を読み込めません';


        retry
          .classList
          .add(
            'show'
          );


        setTimeout(
          close,
          2200
        );

      },
      {
        once:true
      }
    );


  const play =
    ()=>{

      const p =
        video.play();


      if(
        p
        &&
        typeof p.catch ===
        'function'
      ){

        p.catch(
          ()=>{

            retry.textContent =
              '▶ タップしてOP再生';


            retry
              .classList
              .add(
                'show'
              );

          }
        );

      }

    };


  retry
    ?.addEventListener(
      'click',
      e=>{

        e.stopPropagation();

        retry
          .classList
          .remove(
            'show'
          );

        play();

      }
    );


  play();

}

/* =========================================================
   GPS
   ========================================================= */

function startGPS(){

  if(
    !navigator.geolocation
  ){

    toast(
      '位置情報に対応していません'
    );

    return;

  }


  navigator.geolocation
    .getCurrentPosition(

      onGps,

      onGpsError,

      {
        enableHighAccuracy:true,
        maximumAge:0,
        timeout:15000
      }

    );


  navigator.geolocation
    .watchPosition(

      onGps,

      onGpsError,

      {
        enableHighAccuracy:true,
        maximumAge:700,
        timeout:15000
      }

    );

}


function onGps(p){

  const c =
    p.coords;


  const ol =
    prevLat;


  const og =
    prevLng;


  const first =
    !gpsFix;


  gpsFix =
    true;


  acc =
    c.accuracy
    ||
    20;


  lat =
    c.latitude;


  lng =
    c.longitude;


  $('gpsState').textContent =
    'GPS FIX';


  $('gpsState')
    .classList
    .add(
      'ok'
    );


  userMarker
    .setLngLat(
      [
        lng,
        lat
      ]
    );


  userMarker
    .getElement()
    .style
    .display =
      'block';


  $('tLat').textContent =
    lat.toFixed(4);


  $('tLon').textContent =
    lng.toFixed(4);


  $('tAlt').textContent =

    c.altitude == null

    ?
    '---'

    :
    Math.round(
      c.altitude
    );


  speed =

    c.speed != null

    &&

    c.speed >= 0

    ?

    Math.round(
      c.speed*3.6
    )

    :
    0;


  $('tSpd').textContent =
    speed;


  let raw =

    c.heading != null

    &&

    !Number.isNaN(
      c.heading
    )

    ?

    (
      (
        c.heading%360
      )
      +
      360
    )%360

    :
    null;


  if(
    ol != null
    &&
    og != null
    &&
    distance(
      ol,
      og,
      lat,
      lng
    ) >= 3.5
  ){

    raw =
      bearing(
        ol,
        og,
        lat,
        lng
      );

  }


  if(
    raw != null
  ){

    if(
      !headingReady
    ){

      smoothed =
        raw;

      headingReady =
        true;

    }else{

      smoothed =
        smoothAngle(
          smoothed,
          raw,
          speed >= 8
          ?
          .5
          :
          .28
        );

    }


    heading =
      smoothed;


    $('tHdg').textContent =
      Math.round(
        heading
      );


    $('tDir').textContent =
      compassDirection(
        heading
      );

  }


  prevLat =
    lat;


  prevLng =
    lng;


  if(
    tracking
    ||
    routing
  ){

    follow(
      first
    );

  }else{

    updateCar();

  }


  if(
    Date.now() -
    lastWeather >
    1800000
  ){

    refreshWeather(
      true
    );

  }


  if(
    radar
  ){

    refreshCameras();

    checkRadar();

  }


  if(
    routing
  ){

    updateGuidance();

    maybeUpdateHighwayMode();

  }else if(
    highwayMode
  ){

    setHighwayMode(
      false
    );

  }


  if(
    first
  ){

    setTimeout(
      () =>
        warmNearby(
          false
        )
        .catch(()=>{}),
      1200
    );

  }

}


function onGpsError(e){

  toast(

    e.code === 1

    ?
    '位置情報を許可してください'

    :
    'GPSを取得できません'

  );

}


function smoothAngle(
  a,
  b,
  k
){

  const d =
    (
      (
        b-a+540
      )%360
    )
    -
    180;


  return(
    a +
    d*k +
    360
  )%360;

}


function compassDirection(d){

  return[
    'N',
    'NE',
    'E',
    'SE',
    'S',
    'SW',
    'W',
    'NW'
  ][
    Math.round(
      (
        (
          d%360
        )
        +
        360
      )%360/
      45
    )%8
  ];

}


function updateCar(){

  userMarker
    ?.setRotation(
      headingUp
      ?
      0
      :
      heading
    );

}


function follow(
  now=false
){

  if(
    !gpsFix
  ){

    return;

  }


  updateCar();


  const right =

    highwayMode

    ?

    Math.round(
      innerWidth*.49
    )
    +
    25

    :
    55;


  map.easeTo({

    center:[
      lng,
      lat
    ],

    bearing:
      headingUp
      &&
      headingReady

      ?
      heading

      :
      0,

    zoom:
      navZoom,

    pitch:
      0,

    padding:

      routing

      ?

      {
        top:95,
        bottom:205,
        left:55,
        right
      }

      :

      {
        top:65,
        bottom:115,
        left:45,
        right:45
      },

    duration:
      now
      ?
      0
      :
      260,

    essential:true

  });

}

/* =========================================================
   住所・名称検索
   ========================================================= */

function normalizeSearchText(
  s=''
){

  return String(s)
    .normalize('NFKC')
    .replace(
      /[‐-‒–—―−]/g,
      '-'
    )
    .replace(
      /\s+/g,
      ' '
    )
    .trim();

}


function searchKey(
  s=''
){

  return normalizeSearchText(
    s
  )
  .toLowerCase()
  .replace(
    /[\s,、・]/g,
    ''
  );

}


function searchScore(
  q,
  x
){

  const k =
    searchKey(
      q
    );


  const n =
    searchKey(
      x.name
    );


  const d =
    searchKey(
      x.display
    );


  let score =

    n === k

    ?
    0

    :

    n.startsWith(k)

    ?
    4

    :

    n.includes(k)

    ?
    8

    :

    d.includes(k)

    ?
    14

    :
    28;


  if(
    Number.isFinite(
      x.dist
    )
  ){

    score +=
      Math.min(
        10,
        x.dist/8
      );

  }


  return score;

}


async function fetchJsonTimeout(
  url,
  ms=9000,
  options={}
){

  const c =
    new AbortController();


  const t =
    setTimeout(
      () =>
        c.abort(),
      ms
    );


  try{

    const r =
      await fetch(
        url,
        {
          ...options,

          signal:
            c.signal,

          cache:
            'no-store'
        }
      );


    if(
      !r.ok
    ){

      throw new Error(
        'HTTP ' +
        r.status
      );

    }


    return await r.json();

  }finally{

    clearTimeout(
      t
    );

  }

}


async function searchNominatim(q){

  const p =
    new URLSearchParams({

      format:
        'jsonv2',

      q,

      countrycodes:
        'jp',

      limit:
        '20',

      addressdetails:
        '1',

      namedetails:
        '1',

      extratags:
        '1',

      'accept-language':
        'ja'

    });


  if(
    gpsFix
  ){

    p.set(
      'viewbox',
      `${lng-1.1},${lat+0.9},${lng+1.1},${lat-0.9}`
    );

  }


  const d =
    await fetchJsonTimeout(

      'https://nominatim.openstreetmap.org/search?' +
      p.toString(),

      9000

    );


  return(

    Array.isArray(d)

    ?

    d.map(
      x => ({

        lat:
          +x.lat,

        lon:
          +x.lon,

        name:
          x.namedetails?.['name:ja']
          ||
          x.namedetails?.name
          ||
          x.name
          ||
          x.display_name?.split(',')[0]
          ||
          '名称不明',

        display:
          x.display_name
          ||
          '',

        source:
          'OSM'

      })
    )

    :
    []

  );

}


async function searchGsi(q){

  const variants =

    [
      normalizeSearchText(q),

      normalizeSearchText(q)
        .replace(
          /\s/g,
          ''
        )
    ];


  for(
    const v
    of
    [
      ...new Set(
        variants
      )
    ]
  ){

    try{

      const d =
        await fetchJsonTimeout(

          'https://msearch.gsi.go.jp/address-search/AddressSearch?q=' +
          encodeURIComponent(v),

          8000

        );


      if(
        Array.isArray(d)
        &&
        d.length
      ){

        return d.map(
          x => ({

            lat:
              +x.geometry?.coordinates?.[1],

            lon:
              +x.geometry?.coordinates?.[0],

            name:
              x.properties?.title
              ||
              q,

            display:
              x.properties?.title
              ||
              q,

            source:
              'GSI'

          })
        );

      }

    }catch(_){}

  }


  return[];

}


function overpassRegexEscape(s){

  return normalizeSearchText(
    s
  )

  .replace(
    /[\\.^$|?*+(){}\[\]]/g,
    '\\$&'
  )

  .replace(
    /"/g,
    ''
  );

}


async function searchNearbyNameFallback(q){

  if(
    !gpsFix
    ||
    normalizeSearchText(q).length < 2
  ){

    return[];

  }


  const re =
    overpassRegexEscape(
      q
    );


  const query =
    `[out:json][timeout:8];` +

    `(` +

    `nwr["name"~"${re}",i](around:20000,${lat},${lng});` +

    `nwr["name:ja"~"${re}",i](around:20000,${lat},${lng});` +

    `nwr["brand"~"${re}",i](around:20000,${lat},${lng});` +

    `);` +

    `out center tags 25;`;


  const d =
    await overpassFirst(
      query,
      8000
    );


  return(
    d?.elements
    ||
    []
  )

  .map(
    x => {

      const a =
        x.lat
        ??
        x.center?.lat;


      const o =
        x.lon
        ??
        x.center?.lon;


      const t =
        x.tags
        ||
        {};


      return{

        lat:
          +a,

        lon:
          +o,

        name:
          t['name:ja']
          ||
          t.name
          ||
          t.brand
          ||
          q,

        display:
          [
            t['addr:prefecture'],
            t['addr:city'],
            t['addr:suburb'],
            t['addr:street']
          ]
          .filter(Boolean)
          .join(' ')
          ||
          '周辺施設',

        source:
          'OVERPASS'

      };

    }
  )

  .filter(
    x =>
      Number.isFinite(
        x.lat
      )
      &&
      Number.isFinite(
        x.lon
      )
  );

}


async function smartSearch(
  button=$('searchBtn')
){

  const q =
    normalizeSearchText(
      $('searchInput')
        ?.value
    );


  if(
    !q
  ){

    setSearchState(
      '施設名・住所・番地を入力してください',
      true
    );

    return;

  }


  button
    ?.classList
    .add(
      'busy'
    );


  if(
    button
  ){

    button.textContent =
      '検索中';

  }


  setSearchState(
    '🔎 住所・施設名を検索しています…'
  );


  let results = [];
  let errors = 0;


  const settled =
    await Promise.allSettled(
      [
        searchNominatim(q),
        searchGsi(q)
      ]
    );


  for(
    const x
    of settled
  ){

    if(
      x.status ===
      'fulfilled'
    ){

      results.push(
        ...x.value
      );

    }else{

      errors++;

    }

  }


  if(
    results.length < 2
  ){

    try{

      results.push(
        ...await searchNearbyNameFallback(
          q
        )
      );

    }catch(_){

      errors++;

    }

  }


  const seen =
    new Set();


  results =
    results.filter(
      x => {

        if(
          !Number.isFinite(
            x.lat
          )
          ||
          !Number.isFinite(
            x.lon
          )
          ||
          !inBounds(
            x.lat,
            x.lon
          )
        ){

          return false;

        }


        const k =
          `${x.lat.toFixed(5)},${x.lon.toFixed(5)}`;


        if(
          seen.has(k)
        ){

          return false;

        }


        seen.add(k);


        return true;

      }
    );


  results.forEach(
    x => {

      x.dist =

        gpsFix

        ?

        distance(
          lat,
          lng,
          x.lat,
          x.lon
        )
        /
        1000

        :
        null;


      x.score =
        searchScore(
          q,
          x
        );

    }
  );


  results.sort(
    (
      a,
      b
    ) =>
      a.score -
      b.score

      ||

      (
        (
          a.dist
          ??
          9999
        )
        -
        (
          b.dist
          ??
          9999
        )
      )
  );


  button
    ?.classList
    .remove(
      'busy'
    );


  if(
    button
  ){

    button.textContent =
      '検索';

  }


  if(
    !results.length
  ){

    setSearchState(

      errors

      ?

      '検索サービスが混雑しているか候補がありません。少し待って再試行してください。'

      :

      '候補が見つかりませんでした。',

      true

    );


    return;

  }


  setSearchState(
    `${results.length}件の候補を見つけました`
  );


  showResults(

    results.slice(
      0,
      18
    ),

  );

}


function inBounds(

){

    &&
    a <= 37.65
    &&
    o >= 138.35
    &&

  );

}


/* =========================================================
   周辺検索
   ========================================================= */

function cacheFresh(entry){

  return(

    !!entry

    &&

    Date.now() -
    entry.at <
    NEARBY_TTL

    &&

    gpsFix

    &&

    distance(
      entry.lat,
      entry.lng,
      lat,
      lng
    )
    <
    700

  );

}


function categoryFromTags(
  t={}
){

  if(
    t.shop ===
    'convenience'
  ){

    return(
      'convenience'
    );

  }


  if(
    t.amenity ===
    'fuel'
  ){

    return(
      'fuel'
    );

  }


  if(
    t.amenity ===
    'parking'
  ){

    return(
      'parking'
    );

  }


  if(
    t.shop ===
    'supermarket'
  ){

    return(
      'supermarket'
    );

  }


  if(
    [
      'restaurant',
      'fast_food',
      'cafe'
    ]
    .includes(
      t.amenity
    )
  ){

    return(
      'food'
    );

  }


  if(
    t.amenity ===
    'toilets'
  ){

    return(
      'toilets'
    );

  }


  return(
    null
  );

}


function rowsFromElements(
  elements,
  key,
  label
){

  const seen =
    new Set();


  const out = [];


  for(
    const x
    of
    elements
    ||
    []
  ){

    const t =
      x.tags
      ||
      {};


    if(
      key
      &&
      categoryFromTags(t)
      !==
      key
    ){

      continue;

    }


    const a =
      x.lat
      ??
      x.center?.lat;


    const o =
      x.lon
      ??
      x.center?.lon;


    if(
      !Number.isFinite(
        +a
      )
      ||
      !Number.isFinite(
        +o
      )
    ){

      continue;

    }


    const k =
      `${(+a).toFixed(5)},${(+o).toFixed(5)}`;


    if(
      seen.has(k)
    ){

      continue;

    }


    seen.add(k);


    out.push({

      lat:
        +a,

      lon:
        +o,

      name:
        t['name:ja']
        ||
        t.name
        ||
        t.brand
        ||
        t.operator
        ||
        `名称不明の${label}`,

      display:
        [
          t['addr:city'],
          t['addr:suburb'],
          t['addr:street']
        ]
        .filter(Boolean)
        .join(' ')
        ||
        label,

      source:
        'OVERPASS',

      dist:
        distance(
          lat,
          lng,
          +a,
          +o
        )
        /
        1000

    });

  }


  out.sort(
    (
      a,
      b
    ) =>
      a.dist -
      b.dist
  );


  return out;

}


function buildWarmQuery(
  radius=2500
){

  return(

    `[out:json][timeout:7];`

    +

    `(`

    +

    `nwr["shop"="convenience"](around:${radius},${lat},${lng});`

    +

    `nwr["amenity"="fuel"](around:${radius},${lat},${lng});`

    +

    `nwr["amenity"="parking"](around:${radius},${lat},${lng});`

    +

    `nwr["shop"="supermarket"](around:${radius},${lat},${lng});`

    +

    `nwr["amenity"="restaurant"](around:${radius},${lat},${lng});`

    +

    `nwr["amenity"="fast_food"](around:${radius},${lat},${lng});`

    +

    `nwr["amenity"="cafe"](around:${radius},${lat},${lng});`

    +

    `nwr["amenity"="toilets"](around:${radius},${lat},${lng});`

    +

    `);`

    +

    `out center tags qt 140;`

  );

}


function buildCategoryQuery(
  cat,
  radius=8000
){

  const parts =
    cat.filters.map(
      (
        [
          k,
          v
        ]
      ) =>
        `nwr["${k}"="${v}"](around:${radius},${lat},${lng});`
    );


  return(

    `[out:json][timeout:8];`

    +

    `(${parts.join('')});`

    +

    `out center tags qt 70;`

  );

}


/* =========================================================
   Overpass
   2サーバー同時接続・先に返った方を使用
   ========================================================= */

async function overpassFirst(
  query,
  ms=7000
){

  return await new Promise(
    (
      resolve,
      reject
    )=>{

      let done =
        false;


      let failed =
        0;


      OVER.forEach(
        (
          ep,
          i
        )=>{

          fetchJsonTimeout(

            ep
            +
            '?data='
            +
            encodeURIComponent(
              query
            ),

            ms
            +
            i*600

          )

          .then(
            d=>{

              if(
                done
              ){

                return;

              }


              if(
                d
                &&
                Array.isArray(
                  d.elements
                )
              ){

                done =
                  true;


                resolve(d);

              }else{

                throw new Error(
                  'invalid'
                );

              }

            }
          )

          .catch(
            ()=>{

              failed++;


              if(
                !done
                &&
                failed >=
                OVER.length
              ){

                reject(
                  new Error(
                    'overpass unavailable'
                  )
                );

              }

            }
          );

        }
      );

    }
  );

}


/* =========================================================
   周辺施設先読み
   ========================================================= */

async function warmNearby(
  force=false
){

  if(
    !gpsFix
  ){

    return null;

  }


  const fresh =

    !force

    &&

    nearbyWarmLat != null

    &&

    Date.now() -
    nearbyWarmAt <
    NEARBY_TTL

    &&

    distance(
      nearbyWarmLat,
      nearbyWarmLng,
      lat,
      lng
    )
    <
    700;


  if(
    fresh
  ){

    return true;

  }


  if(
    nearbyWarmPromise
  ){

    return nearbyWarmPromise;

  }


  const originLat =
    lat;


  const originLng =
    lng;


  nearbyWarmPromise =

    (
      async()=>{

        const d =
          await overpassFirst(

            buildWarmQuery(
              2500
            ),

            6500

          );


        for(
          const key
          of
          Object.keys(
            NEARBY_CATEGORIES
          )
        ){

          const cat =
            NEARBY_CATEGORIES[
              key
            ];


          const items =
            rowsFromElements(

              d.elements,

              key,

              cat.label

            )

            .slice(
              0,
              15
            );


          nearbyCache.set(

            key,

            {

              at:
                Date.now(),

              lat:
                originLat,

              lng:
                originLng,

              items

            }

          );

        }


        nearbyWarmAt =
          Date.now();


        nearbyWarmLat =
          originLat;


        nearbyWarmLng =
          originLng;


        return true;

      }
    )()

    .finally(
      () =>
        nearbyWarmPromise =
          null
    );


  return nearbyWarmPromise;

}


/* =========================================================
   GPS未取得時
   ========================================================= */

async function ensureGps(){

  if(
    gpsFix
  ){

    return true;

  }


  if(
    !navigator.geolocation
  ){

    return false;

  }


  setSearchState(
    '📡 現在地を取得しています…'
  );


  return await new Promise(
    resolve =>

      navigator.geolocation
        .getCurrentPosition(

          p=>{

            onGps(p);

            resolve(
              true
            );

          },

          ()=>{

            resolve(
              false
            );

          },

          {
            enableHighAccuracy:true,
            maximumAge:0,
            timeout:12000
          }

        )
  );

}


/* =========================================================
   近くの○○
   ========================================================= */

async function nearby(
  key,
  button
){

  const cat =
    NEARBY_CATEGORIES[
      key
    ];


  if(
    !cat
  ){

    return;

  }


  if(
    !(
      await ensureGps()
    )
  ){

    setSearchState(
      '現在地を取得できません。位置情報を許可してください。',
      true
    );

    return;

  }


  const cached =
    nearbyCache.get(
      key
    );


  if(
    cacheFresh(
      cached
    )
    &&
    cached.items.length
  ){

    showResults(

      cached.items,

      `近くの${cat.label}`

    );


    return;

  }


  const old =
    button
      ?.textContent;


  button
    ?.classList
    .add(
      'busy'
    );


  if(
    button
  ){

    button.textContent =
      '検索中…';

  }


  setSearchState(
    `🔎 近くの${cat.label}を検索しています…`
  );


  try{

    try{

      await warmNearby(
        true
      );

    }catch(_){}


    let entry =
      nearbyCache.get(
        key
      );


    let items =

      cacheFresh(
        entry
      )

      ?

      entry.items

      :
      [];


    if(
      items.length < 3
    ){

      const d =
        await overpassFirst(

          buildCategoryQuery(
            cat,
            8000
          ),

          7500

        );


      items =
        rowsFromElements(

          d.elements,

          key,

          cat.label

        )

        .slice(
          0,
          15
        );


      nearbyCache.set(

        key,

        {

          at:
            Date.now(),

          lat,

          lng,

          items

        }

      );

    }


    if(
      !items.length
    ){

      throw new Error(
        'empty'
      );

    }


    setSearchState(
      `${cat.label}を近い順で表示します`
    );


    showResults(

      items,

      `近くの${cat.label}`

    );

  }catch(_){

    setSearchState(
      `近くの${cat.label}を取得できませんでした。もう一度押してください。`,
      true
    );


    toast(
      `${cat.label}の検索に失敗しました`
    );

  }finally{

    button
      ?.classList
      .remove(
        'busy'
      );


    if(
      button
    ){

      button.textContent =
        old;

    }

  }

}

async function reliableRoute(
  m,
  p,
  fa,
  fo,
  ta,
  to
){

  try{

    return await valRoute(
      m,
      p,
      fa,
      fo,
      ta,
      to
    );

  }catch(_){

    const f =
      await snap(
        fa,
        fo
      );


    const t =
      await snap(
        ta,
        to
      );


    const r =
      await osrmRoute(
        m,
        f.lat,
        f.lon,
        t.lat,
        t.lon
      );


    r.fallback =
      true;


    return r;

  }

}


async function snap(
  a,
  o
){

  const r =
    await timedFetch(

      `${OSRM}/nearest/v1/driving/${o},${a}?number=1`,

      9000

    );


  const d =
    await r.json();


  const w =
    d.waypoints?.[0];


  if(
    !w?.location
  ){

    throw 0;

  }


  return{

    lon:
      +w.location[0],

    lat:
      +w.location[1]

  };

}


async function osrmRoute(
  m,
  fa,
  fo,
  ta,
  to
){

  const r =
    await timedFetch(

      `${OSRM}/route/v1/driving/${fo},${fa};${to},${ta}?overview=full&geometries=geojson&steps=true`,

      12000

    );


  const d =
    await r.json();


  if(
    d.code !==
    'Ok'
    ||
    !d.routes?.length
  ){

    throw 0;

  }


  return normalizeRoute(
    d.routes[0],
    m
  );

}


async function valRoute(
  m,
  p,
  fa,
  fo,
  ta,
  to
){

  const req = {

    locations:[
      {
        lat:fa,
        lon:fo,
        type:'break'
      },

      {
        lat:ta,
        lon:to,
        type:'break'
      }
    ],

    costing:
      'auto',

    costing_options:{
      auto:
        p.opts
    },

    units:
      'kilometers',

    language:
      'ja-JP',

    directions_type:
      'instructions',

    format:
      'osrm',

    shape_format:
      'geojson'

  };


  const r =
    await timedFetch(

      VAL
      +
      '?json='
      +
      encodeURIComponent(
        JSON.stringify(
          req
        )
      ),

      13000

    );


  const d =
    await r.json();


  if(
    !d.routes?.length
  ){

    throw 0;

  }


  return normalizeRoute(
    d.routes[0],
    m
  );

}


async function timedFetch(
  url,
  ms
){

  const c =
    new AbortController();


  const t =
    setTimeout(
      () =>
        c.abort(),
      ms
    );


  try{

    const r =
      await fetch(
        url,
        {
          signal:
            c.signal
        }
      );


    if(
      !r.ok
    ){

      throw 0;

    }


    return r;

  }finally{

    clearTimeout(
      t
    );

  }

}


function normalizeRoute(
  r,
  m
){

  return{

    mode:
      m,

    geometry:
      r.geometry,

    distance:
      +r.distance
      ||
      0,

    duration:
      +r.duration
      ||
      0,

    steps:
      (
        r.legs
        ||
        []
      )

      .flatMap(
        l =>
          l.steps
          ||
          []
      )

      .map(
        s => ({

          distance:
            +s.distance
            ||
            0,

          name:
            s.name
            ||
            '',

          maneuver:
            s.maneuver
            ||
            {}

        })
      )

  };

}


function selectMode(m){

function showCandidate(m){

  );

        /
        約 ${Math.max(1,Math.round(r.duration/60))} 分
      </b>

      <br>

      <small>
        ${profiles[m].label}ルート
      </small>
    `;


  $('startBtn').disabled =
    false;

}


function clearRoute(){

  try{

    if(
      map.getLayer(
        'route'
      )
    ){

      map.removeLayer(
        'route'
      );

    }


    if(
      map.getLayer(
        'routeCase'
      )
    ){

      map.removeLayer(
        'routeCase'
      );

    }


    if(
      map.getSource(
        'route'
      )
    ){

      map.removeSource(
        'route'
      );

    }

  }catch(_){}


  routeOn =
    false;

}


function drawRoute(g){

  if(
    !map.isStyleLoaded()
  ){

    map.once(
      'load',
      () =>
        drawRoute(g)
    );

    return;

  }


  clearRoute();


  const f =

    g?.type ===
    'Feature'

    ?

    g

    :

    {
      type:'Feature',
      properties:{},
      geometry:g
    };


  map.addSource(
    'route',
    {
      type:'geojson',
      data:f
    }
  );


  map.addLayer({

    id:
      'routeCase',

    type:
      'line',

    source:
      'route',

    layout:{
      'line-cap':'round',
      'line-join':'round'
    },

    paint:{
      'line-color':'#00314b',
      'line-width':12,
      'line-opacity':.85
    }

  });


  map.addLayer({

    id:
      'route',

    type:
      'line',

    source:
      'route',

    layout:{
      'line-cap':'round',
      'line-join':'round'
    },

    paint:{
      'line-color':'#00d4ff',
      'line-width':7,
      'line-opacity':.98
    }

  });


  routeOn =
    true;


  const cs =
    geoCoords(
      g
    );


  if(
    cs.length
  ){

    const b =
      new maplibregl.LngLatBounds();


    cs.forEach(
      x =>
        b.extend(x)
    );


    tracking =
      false;


    map.setBearing(
      0
    );


    map.fitBounds(

      b,

      {

        padding:{
          top:80,
          bottom:175,
          left:65,
          right:65
        },

        maxZoom:
          16.5,

        duration:
          450

      }

    );

  }

}

/* =========================================================
   案内更新
   ========================================================= */

function updateGuidance(){

  if(
    !routing
    ||
    !active
    ||
    coords.length < 2
  ){

    return;

  }


  const n =
    nearestRoute(
      lat,
      lng,
      coords
    );


  if(
    n.distance >
    Math.max(
      70,
      (acc||20)*1.8
    )
  ){

    offCount++;


    if(
      offCount >= 3
      &&
      Date.now() -
      lastReroute >
      10000
    ){

      reroute();

    }

  }else{

    offCount =
      0;

  }


  const prog =
    cum[
      Math.min(
        n.index,
        cum.length-1
      )
    ]
    ||
    0;


  const total =
    cum.at(-1)
    ||
    active.distance;


  const rem =
    Math.max(
      0,
      total-prog
    );


  const sec =
    Math.max(
      0,
      Math.round(
        active.duration*
        (
          total
          ?
          rem/total
          :
          0
        )
      )
    );


  const arr =
    new Date(
      Date.now()+
      sec*1000
    );


  $('remaining').textContent =

    rem >= 1000

    ?

    `残り ${(rem/1000).toFixed(1)} km`

    :

    `残り ${Math.round(rem)} m`;


  $('eta').textContent =

    `約 ${Math.max(1,Math.round(sec/60))}分 / ${
      arr.toLocaleTimeString(
        'ja-JP',
        {
          hour:'2-digit',
          minute:'2-digit'
        }
      )
    }着`;


  $('routeStatus')
    .classList
    .add(
      'show'
    );


  if(
    distance(
      lat,
      lng,
      dLat,
      dLng
    )
    <
    35
  ){

    toast(
      '🏁 目的地周辺です'
    );


    speak(
      '目的地周辺です'
    );


    stopGuidance(
      true
    );


    return;

  }


  let bi =
    stepIndex;


  for(
    let i =
      stepIndex;

    i <
      steps.length;

    i++
  ){

    const l =
      steps[i]
      ?.maneuver
      ?.location;


    if(
      !l
    ){

      continue;

    }


    const idx =
      nearIdx(
        l[1],
        l[0],
        coords
      );


    if(
      (
        cum[idx]
        ||
        0
      )
      >
      prog+8
    ){

      bi =
        i;


      break;

    }


    bi =
      Math.min(
        i+1,
        steps.length-1
      );

  }


  stepIndex =
    bi;


  const st =
    steps[
      stepIndex
    ];


  const m =
    st
      ?.maneuver;


  if(
    !m?.location
  ){

    return;

  }


  const idx =
    nearIdx(
      m.location[1],
      m.location[0],
      coords
    );


  const dist =
    Math.max(
      0,
      (
        cum[idx]
        ||
        0
      )
      -
      prog
    );


  const ins =
    instruction(
      st
    );


  $('guideArrow').textContent =
    icon(
      m.type,
      m.modifier
    );


  $('guideText').textContent =
    ins;


  $('guideDist').textContent =
    Math.round(
      dist
    );


  $('guide')
    .classList
    .toggle(
      'show',
      dist < 800
      ||
      stepIndex === 0
    );


  for(
    const th
    of
    [
      700,
      300,
      100
    ]
  ){

    if(
      dist <= th
    ){

      const k =
        `${stepIndex}-${th}`;


      if(
        !spoken.has(k)
      ){

        spoken.add(k);


        speak(
          `${th}メートル先、${ins}`
        );

      }


      break;

    }

  }


  if(
    highwayMode
  ){

    updateHighwayPanel();

  }

}


async function reroute(){

  if(
    !routing
    ||
    dLat == null
  ){

    return;

  }


  lastReroute =
    Date.now();


  offCount =
    0;


  toast(
    '↻ 再探索します'
  );


  try{

    const r =
      await reliableRoute(
        mode,
        profiles[mode],
        lat,
        lng,
        dLat,
        dLng
      );


    active =
      r;


    drawRoute(
      r.geometry
    );


    coords =
      geoCoords(
        r.geometry
      );


    cum =
      buildCum(
        coords
      );


    steps =
      r.steps
      ||
      [];


    stepIndex =
      0;


    spoken.clear();


    tracking =
      true;


    follow(
      true
    );

  }catch(_){

    toast(
      '再探索に失敗しました'
    );

  }

}


function instruction(s){

  const m =
    s.maneuver
    ||
    {};


  const name =

    s.name

    ?

    `「${s.name}」へ`

    :
    '';


  if(
    m.type ===
    'arrive'
  ){

    return(
      '目的地周辺です'
    );

  }


  if(
    m.type ===
    'merge'
  ){

    return(
      `${name||'本線'}に合流`
    );

  }


  const x =
    m.modifier
    ||
    'straight';


  let d =
    '直進';


  if(
    x.includes(
      'right'
    )
  ){

    d =
      x.includes(
        'slight'
      )

      ?

      '斜め右方向'

      :

      '右方向';

  }else if(
    x.includes(
      'left'
    )
  ){

    d =
      x.includes(
        'slight'
      )

      ?

      '斜め左方向'

      :

      '左方向';

  }else if(
    x.includes(
      'uturn'
    )
  ){

    d =
      'Uターン';

  }


  return(
    name
    ?
    `${name}${d}`
    :
    d
  );

}


function icon(
  t,
  m=''
){

  if(
    t ===
    'arrive'
  ){

    return(
      '🏁'
    );

  }


  if(
    m.includes(
      'uturn'
    )
  ){

    return(
      '↩'
    );

  }


  if(
    m.includes(
      'right'
    )
  ){

    return(
      m.includes(
        'slight'
      )
      ?
      '↗'
      :
      '→'
    );

  }


  if(
    m.includes(
      'left'
    )
  ){

    return(
      m.includes(
        'slight'
      )
      ?
      '↖'
      :
      '←'
    );

  }


  return(
    '↑'
  );

}

    /(高速|自動車道|expressway|motorway|首都高|東名|中央道|圏央道|外環|関越|東北道|常磐道|東関東道|館山道|京葉道路|アクアライン|湾岸線)/i

  );

function setHighwayMode(

){

function maybeUpdateHighwayMode(
  force=false
){

  if(
    !routing
    ||
    !gpsFix
  ){

    setHighwayMode(
      false
    );


    return;

  }


  const st =
    steps[
      stepIndex
    ]
    ||
    {};


  const name =
    (
      st.name
      ||
      ''
    )
    .trim();


  const heur =

    isHighwayName(
      name
    )

    ||

    st.maneuver?.type ===
    'on ramp';


  if(
    heur
  ){

    setHighwayMode(

      true,

      {
        name:
          name
          ||
          highwayInfo.name
      }

    );

  }


  const moved =

    lastHighwayLat == null

    ?

    Infinity

    :

    distance(
      lastHighwayLat,
      lastHighwayLng,
      lat,
      lng
    );


  if(
    !highwayBusy
    &&
    (
      force
      ||
      Date.now() -
      lastHighwayCheck >
      18000
      ||
      moved > 450
    )
  ){

    checkHighwayRoad(
      heur
    );

  }

}


async function checkHighwayRoad(
  heur=false
){

  highwayBusy =
    true;


  lastHighwayCheck =
    Date.now();


  lastHighwayLat =
    lat;


  lastHighwayLng =
    lng;


  const q =
    `[out:json][timeout:7];way(around:80,${lat},${lng})["highway"~"^(motorway|motorway_link)$"];out tags center 10;`;


  let d =
    null;


  try{

    d =
      await overpassFirst(
        q,
        6500
      );

  }catch(_){}


  highwayBusy =
    false;


  const x =
    d
      ?.elements
      ?.[0];


  if(
    x
  ){

    const t =
      x.tags
      ||
      {};


    setHighwayMode(

      true,

      {

        name:
          t['name:ja']
          ||
          t.name
          ||
          steps[
            stepIndex
          ]?.name
          ||
          '高速道路',

        ref:
          t.ref
          ||
          'EXPWY',

        destination:
          t.destination
          ||
          ''

      }

    );

  }else if(
    !heur
  ){

    setHighwayMode(
      false
    );

  }

}

  const moved =

    Infinity

    :

    distance(

  if(

async function loadCameras(
  force=false
){

  if(
    !radar
    ||
    !gpsFix
    ||
    radarLoading
    ||
    (
      !force
      &&
      Date.now() -
      lastRadarFetch <
      90000
    )
  ){

    return;

  }


  radarLoading =
    true;


  const q =
    `[out:json][timeout:9];node["highway"="speed_camera"](around:15000,${lat},${lng});out tags;`;


  let d =
    null;


  try{

    d =
      await overpassFirst(
        q,
        7500
      );

  }catch(_){}


  radarLoading =
    false;


  if(
    !d?.elements
  ){

    return;

  }


  lastRadarFetch =
    Date.now();


  lastRadarLat =
    lat;


  lastRadarLng =
    lng;


  cameras =
    d.elements.map(
      x => ({

        id:
          x.id,

        lat:
          +x.lat,

        lon:
          +x.lon

      })
    );

}


function checkRadar(){

  if(
    !radar
    ||
    !cameras.length
  ){

    return;

  }


  let n =
    null;


  for(
    const c
    of cameras
  ){

    const d =
      distance(
        lat,
        lng,
        c.lat,
        c.lon
      );


    if(
      d < 1200
      &&
      (
        !n
        ||
        d < n.d
      )
    ){

      n = {
        c,
        d
      };

    }

  }


  if(
    !n
  ){

    return;

  }


  for(
    const th
    of
    [
      1000,
      500,
      200
    ]
  ){

    if(
      n.d <= th
    ){

      const k =
        `${n.c.id}-${th}`;


      if(
        !radarAlerts.has(k)
      ){

        radarAlerts.add(k);


        toast(
          `◎ ${th}m以内に固定式オービス`
        );


        speak(
          `${th}メートル以内に速度取締機があります`
        );

      }


      break;

    }

  }

}

function esc(
  s=''
){

  return String(s)
    .replace(
      /[&<>"']/g,
      c => (
        {
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'
        }[c]
      )
    );

}


function geoCoords(g){

  if(
    !g
  ){

    return[];

  }


  if(
    g.type ===
    'LineString'
  ){

    return(
      g.coordinates
    );

  }


  if(
    g.type ===
    'Feature'
    &&
    g.geometry?.type ===
    'LineString'
  ){

    return(
      g.geometry.coordinates
    );

  }


  return[];

}


function buildCum(a){

  const o = [
    0
  ];


  for(
    let i = 1;
    i < a.length;
    i++
  ){

    o[i] =

      o[i-1]

      +

      distance(
        a[i-1][1],
        a[i-1][0],
        a[i][1],
        a[i][0]
      );

  }


  return o;

}


function nearIdx(
  a,
  o,
  c
){

  let b = 0;
  let d = Infinity;


  const st =

    c.length > 3000

    ?

    3

    :
    1;


  for(
    let i = 0;
    i < c.length;
    i += st
  ){

    const x =
      (
        c[i][0] -
        o
      )
      *
      Math.cos(
        (
          a +
          c[i][1]
        )
        *
        Math.PI/
        360
      );


    const y =
      c[i][1] -
      a;


    const q =
      x*x +
      y*y;


    if(
      q < d
    ){

      d =
        q;


      b =
        i;

    }

  }


  return b;

}


function nearestRoute(
  a,
  o,
  c
){

  const idx =
    nearIdx(
      a,
      o,
      c
    );


  let b =
    idx;


  let d =
    distance(
      a,
      o,
      c[idx][1],
      c[idx][0]
    );


  for(
    let i =
      Math.max(
        0,
        idx-6
      );

    i <=
      Math.min(
        c.length-1,
        idx+6
      );

    i++
  ){

    const q =
      distance(
        a,
        o,
        c[i][1],
        c[i][0]
      );


    if(
      q < d
    ){

      d =
        q;


      b =
        i;

    }

  }


  return{
    index:b,
    distance:d
  };

}


function distance(
  a,
  o,
  b,
  p
){

  const R =
    6371000;


  const x =
    a*
    Math.PI/
    180;


  const y =
    b*
    Math.PI/
    180;


  const da =
    (
      b-a
    )
    *
    Math.PI/
    180;


  const dl =
    (
      p-o
    )
    *
    Math.PI/
    180;


  const q =
    Math.sin(
      da/2
    )**2

    +

    Math.cos(x)
    *
    Math.cos(y)
    *
    Math.sin(
      dl/2
    )**2;


  return(
    2*
    R*
    Math.atan2(
      Math.sqrt(q),
      Math.sqrt(1-q)
    )
  );

}


function bearing(
  a,
  o,
  b,
  p
){

  const x =
    a*
    Math.PI/
    180;


  const y =
    b*
    Math.PI/
    180;


  const l =
    (
      p-o
    )
    *
    Math.PI/
    180;


  const Y =
    Math.sin(l)
    *
    Math.cos(y);


  const X =
    Math.cos(x)
    *
    Math.sin(y)

    -

    Math.sin(x)
    *
    Math.cos(y)
    *
    Math.cos(l);


  return(
    Math.atan2(
      Y,
      X
    )
    *
    180/
    Math.PI
    +
    360
  )%360;

}
