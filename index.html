<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<title>NAVI ZETE v89 GPS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
button,input{font:inherit}
button{touch-action:manipulation;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:#111}
#mapViewport{position:absolute;inset:0;background:#d9e1e8;overflow:hidden;touch-action:none;z-index:1}
#tileLayer,#routeSvg,#markerLayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tileLayer img{position:absolute;width:256px;height:256px;pointer-events:none;user-select:none;-webkit-user-drag:none;background:#d9e1e8}
#routeSvg{overflow:visible}
#routePathShadow{fill:none;stroke:rgba(0,0,0,.55);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
#routePath{fill:none;stroke:#0b8cff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.marker{position:absolute;transform:translate(-50%,-50%);will-change:left,top,transform}
.userMarker{width:24px;height:24px;border:3px solid #fff;border-radius:50%;background:#0b8cff;box-shadow:0 1px 5px #000,0 0 0 6px rgba(11,140,255,.18)}
.userMarker:after{content:"";position:absolute;left:50%;top:-14px;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:14px solid #0b8cff;filter:drop-shadow(0 0 2px #fff)}
.destMarker{width:24px;height:24px;border-radius:50% 50% 50% 0;background:#e72e48;border:3px solid #fff;transform:translate(-50%,-75%) rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.55)}
#attribution{position:absolute;z-index:3;right:4px;bottom:67px;font-size:9px;color:#111;background:rgba(255,255,255,.78);padding:2px 5px;border-radius:3px;pointer-events:auto}
#attribution a{color:#145ea8;text-decoration:none}

#topBar{position:absolute;z-index:100;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#searchBox{pointer-events:auto;position:relative;flex:1;max-width:760px;background:rgba(12,18,27,.95);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:7px;box-shadow:0 5px 20px rgba(0,0,0,.35)}
#searchRow{display:flex;gap:6px}
#searchInput{min-width:0;flex:1;height:43px;border:1px solid #445160;border-radius:8px;background:#060a0f;color:#fff;padding:0 12px;font-size:16px;outline:none}
#searchInput:focus{border-color:#0b8cff}
#searchBtn{height:43px;padding:0 16px;border:0;border-radius:8px;background:#0b73d6;color:white;font-weight:800}
#searchBtn:disabled{opacity:.55}
#results{display:none;max-height:46vh;overflow:auto;margin-top:7px;border-top:1px solid #303b48;-webkit-overflow-scrolling:touch}
#results.show{display:block}
.result{padding:10px 8px;border-bottom:1px solid #28323d;background:rgba(12,18,27,.98)}
.result:active{background:#18334c}
.resultTitle{font-size:14px;font-weight:800}
.resultSub{margin-top:3px;font-size:11px;color:#aeb8c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{pointer-events:none;margin-left:auto;background:rgba(10,16,23,.88);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:9px 12px;font-size:20px;font-weight:800;text-shadow:0 0 10px rgba(0,140,255,.5)}

#mapTools{position:absolute;z-index:90;right:10px;top:76px;display:flex;flex-direction:column;gap:7px}
.toolBtn{width:48px;height:48px;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(11,17,24,.94);color:#fff;font-size:22px;font-weight:800;box-shadow:0 3px 12px rgba(0,0,0,.35)}
#locateBtn{font-size:20px}
#followBtn{font-size:17px;color:#8bc8ff}
#followBtn.on{background:#0b5e9e;color:#fff;border-color:#45adff}

#statusPanel{position:absolute;z-index:80;left:10px;bottom:69px;background:rgba(10,16,23,.92);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;min-width:150px;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none}
.statusLine{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:#a9b3bd;line-height:1.55}.statusLine b{color:#fff;font-size:11px}.speedLine b{font-size:25px;color:#dff2ff}
#version{color:#67bbff}

#navPanel{position:absolute;z-index:95;left:10px;right:70px;top:75px;display:none;pointer-events:none}
#navPanel.show{display:block}
#nextBox{display:flex;align-items:center;gap:12px;max-width:560px;background:rgba(3,42,76,.96);border:1px solid #2aa0ff;border-radius:12px;padding:10px 12px;box-shadow:0 5px 20px rgba(0,0,0,.35)}
#turnArrow{font-size:46px;line-height:1;min-width:55px;text-align:center;text-shadow:0 0 9px #0b8cff}
#turnText{font-size:17px;font-weight:900;line-height:1.3}
#turnDistance{font-size:12px;color:#bfe1ff;margin-top:3px}
#routeInfo{display:flex;gap:6px;margin-top:6px;max-width:560px}
.infoChip{background:rgba(10,16,23,.92);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:6px 9px;font-size:10px;color:#aeb8c2}.infoChip b{display:block;color:#fff;font-size:14px;margin-top:1px}

#bottomBar{position:absolute;z-index:110;left:0;right:0;bottom:0;height:61px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;background:rgba(5,9,13,.97);border-top:1px solid #303945;pointer-events:auto}
.bottomBtn{height:47px;min-width:110px;padding:0 16px;border:1px solid #4e5c6b;border-radius:9px;background:#16202a;color:#fff;font-weight:800}
.bottomBtn.primary{background:#0b69ba;border-color:#40aaff}.bottomBtn.danger{background:#5e2028;border-color:#b85965}.bottomBtn:disabled{opacity:.4}

#toast{position:absolute;z-index:500;left:50%;bottom:76px;transform:translate(-50%,12px);opacity:0;transition:.2s;pointer-events:none;max-width:90vw;background:rgba(0,0,0,.92);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:10px 13px;text-align:center;font-size:13px}.showToast{opacity:1!important;transform:translate(-50%,0)!important}
#errorBanner{display:none;position:absolute;z-index:450;left:10px;right:10px;top:75px;background:#7a2020;border:1px solid #ff7777;border-radius:9px;padding:9px 11px;font-size:12px;font-weight:700}
#errorBanner.show{display:block}

@media(max-width:820px){
 #clock{font-size:16px;padding:11px 8px}
 #mapTools{top:70px;right:7px}.toolBtn{width:44px;height:44px}
 #topBar{left:7px;right:7px}.searchBtn{font-size:14px}
 #navPanel{left:7px;right:58px;top:70px}#turnArrow{font-size:38px;min-width:44px}#turnText{font-size:14px}
 #statusPanel{left:7px;bottom:66px;padding:6px 8px;min-width:135px}
 .bottomBtn{min-width:92px;padding:0 11px;font-size:13px}
 #attribution{bottom:64px}
}
</style>
</head>
<body>
<div id="app">
  <div id="mapViewport" aria-label="地図">
    <div id="tileLayer"></div>
    <svg id="routeSvg" xmlns="http://www.w3.org/2000/svg"><path id="routePathShadow"></path><path id="routePath"></path></svg>
    <div id="markerLayer"><div id="userMarker" class="marker userMarker" style="display:none"></div><div id="destMarker" class="marker destMarker" style="display:none"></div></div>
  </div>
  <div id="attribution"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> / 国土地理院</div>

  <div id="topBar">
    <div id="searchBox">
      <div id="searchRow"><input id="searchInput" type="search" autocomplete="street-address" inputmode="search" placeholder="住所・施設名を入力"><button id="searchBtn">検索</button></div>
      <div id="results"></div>
    </div>
    <div id="clock">--:--</div>
  </div>

  <div id="mapTools">
    <button id="zoomInBtn" class="toolBtn" aria-label="拡大">＋</button>
    <button id="zoomOutBtn" class="toolBtn" aria-label="縮小">−</button>
    <button id="locateBtn" class="toolBtn" aria-label="現在地">◎</button>
    <button id="followBtn" class="toolBtn on" aria-label="追従">追</button>
  </div>

  <div id="navPanel">
    <div id="nextBox"><div id="turnArrow">↑</div><div><div id="turnText">目的地を検索してください</div><div id="turnDistance"></div></div></div>
    <div id="routeInfo"><div class="infoChip">残り<b id="remainDistance">--</b></div><div class="infoChip">到着予定<b id="eta">--:--</b></div><div class="infoChip">目的地<b id="destinationName">--</b></div></div>
  </div>

  <div id="statusPanel">
    <div class="statusLine speedLine"><span>速度</span><span><b id="speed">0</b> km/h</span></div>
    <div class="statusLine"><span>GPS</span><b id="gpsStatus">未取得</b></div>
    <div class="statusLine"><span>精度</span><b id="accuracy">-- m</b></div>
    <div class="statusLine"><span>位置許可</span><b id="permissionState">確認中</b></div>
    <div class="statusLine"><span>VERSION</span><b id="version">v89 GPS</b></div>
  </div>

  <div id="bottomBar">
    <button id="currentBtn" class="bottomBtn">現在地</button>
    <button id="startBtn" class="bottomBtn primary" disabled>案内開始</button>
    <button id="stopBtn" class="bottomBtn danger" disabled>案内終了</button>
  </div>

  <div id="toast"></div>
  <div id="errorBanner"></div>
</div>
