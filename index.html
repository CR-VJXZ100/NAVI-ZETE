<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>純正風カーナビ - リルート＆ヘディングアップ完全対応版</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; background-color: #050505; color: #fff; overflow: hidden; user-select: none; touch-action: manipulation; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        /* ★ 地図を回転させるための特大コンテナ設定 */
        .map-screen { flex: 1; position: relative; border-bottom: 4px solid #111; overflow: hidden; background-color: #111; }
        #map { position: absolute; top: -35%; left: -35%; width: 170%; height: 170%; transition: transform 0.3s linear; transform-origin: center center; }
        .dark-mode .leaflet-tile { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        
        .map-overlay-left { position: absolute; top: 20px; left: 20px; z-index: 9900; display: flex; flex-direction: column; gap: 8px; }
        .map-btn { background: rgba(30, 30, 30, 0.85); border: 1px solid #555; color: white; padding: 12px 15px; font-size: 1rem; font-weight: bold; border-radius: 6px; box-shadow: 2px 2px 8px rgba(0,0,0,0.6); cursor: pointer; text-align: center;}
        .map-btn:active { background: rgba(0, 0, 0, 0.9); transform: scale(0.95); }
        .btn-active-mode { border: 1px solid #00d4ff; color: #00d4ff; box-shadow: 0 0 10px rgba(0,212,255,0.4); }
        
        /* 下部ハードウェアパネル */
        .hardware-panel { height: 90px; background: linear-gradient(to bottom, #2b2b2b 0%, #151515 50%, #0a0a0a 100%); border-top: 2px solid #444; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 9999; position: relative; }
        .hw-btn { background: linear-gradient(to bottom, #111 0%, #222 100%); border: 1px solid #000; border-top: 1px solid #444; color: #ccc; height: 55px; min-width: 65px; margin: 0 4px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; box-shadow: 0 4px 5px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.2); cursor: pointer; position: relative; }
        .hw-btn:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.8), inset 0 2px 4px rgba(0,0,0,0.9); color: #fff; }
        .hw-btn-text { font-size: 0.9rem; padding: 0 15px; }
        .neon-blue { color: #e0f7ff; text-shadow: 0 0 5px #00d4ff, 0 0 10px #008cff, 0 0 20px #0044ff, 0 0 30px #0022cc; }

        @keyframes colorShift { 0% { background-color: #ff3333; box-shadow: 0 0 4px #ff0000; } 33% { background-color: #00d4ff; box-shadow: 0 0 4px #00d4ff; } 66% { background-color: #b000ff; box-shadow: 0 0 4px #b000ff; } 100% { background-color: #ff3333; box-shadow: 0 0 4px #ff0000; } }
        .hw-btn::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 30px; height: 3px; animation: colorShift 6s infinite ease-in-out; opacity: 0.85; }
        .neon-blue::after { animation: colorShift 4s infinite ease-in-out; }
        
        #toast { visibility: hidden; min-width: 300px; background-color: rgba(0, 0, 0, 0.85); color: #fff; text-align: center; border-radius: 10px; padding: 20px; position: fixed; z-index: 10000; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 1.2rem; border: 1px solid #00d4ff; box-shadow: 0 5px 20px rgba(0,0,0,0.7); opacity: 0; transition: opacity 0.3s, bottom 0.3s; line-height: 1.5; }
        #toast.show { visibility: visible; opacity: 1; bottom: 140px; }

        .navi-marker-icon { display: flex; justify-content: center; align-items: center; width: 40px; height: 40px; }
        .navi-arrow { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid #00d4ff; filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.8)); transform-origin: center 70%; transition: transform 0.2s ease-out; }

        .system-modal { position: fixed; top: 5%; left: 8%; right: 8%; bottom: 110px; background: linear-gradient(135deg, #1f1f1f 0%, #0d0d0d 100%); border: 2px solid #444; box-shadow: 0 15px 40px rgba(0,0,0,0.9); border-radius: 8px; z-index: 100000; display: none; flex-direction: column; padding: 25px; overflow-y: auto; }
        .modal-header { font-size: 1.6rem; border-bottom: 2px solid #00d4ff; padding-bottom: 15px; margin-bottom: 20px; color: #fff; text-shadow: 0 0 10px #00d4ff; font-weight: bold; }
        .modal-header.settings-header { border-bottom: 2px solid #aaa; text-shadow: none; color: #eee; }
        .modal-btn { background: linear-gradient(to bottom, #333, #222); padding: 20px 25px; margin-bottom: 15px; border-radius: 5px; font-size: 1.3rem; border: 1px solid #555; cursor: pointer; display: flex; align-items: center; color: #ddd; transition: 0.1s;}
        .modal-btn:active { background: #00d4ff; color: #000; border-color: #00d4ff; }
        
        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input { flex: 1; padding: 15px; border-radius: 5px; border: 1px solid #555; background: #222; color: #fff; font-size: 1.2rem; }
        .search-btn { background: #00d4ff; color: #000; padding: 15px 25px; border-radius: 5px; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .search-btn:active { background: #00a0cc; }

        .results-list-container { display: flex; flex-direction: column; gap: 12px; max-height: 55vh; overflow-y: auto; margin-bottom: 20px; padding-right: 5px; }
        .result-item { background: #222; border: 1px solid #555; padding: 18px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .result-item:active { background: #00d4ff; color: #000; }
        .result-name { font-size: 1.25rem; font-weight: bold; }
        .result-dist { font-size: 1.1rem; color: #00d4ff; background: rgba(0,212,255,0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid #00d4ff; white-space: nowrap; margin-left: 15px; }

        .route-preview { position: fixed; bottom: -350px; left: 0; right: 0; background: linear-gradient(to bottom, #1a1a1a, #050505); border-top: 3px solid #00d4ff; z-index: 9950; padding: 20px; display: flex; flex-direction: column; gap: 15px; transition: bottom 0.3s ease-in-out; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
        .route-preview.show { bottom: 90px; } 
        .preview-header { font-size: 1.4rem; font-weight: bold; color: #fff; text-align: center; }
        .preview-tabs { display: flex; gap: 10px; }
        .preview-tab { flex: 1; text-align: center; padding: 15px; background: #333; border: 2px solid #555; border-radius: 5px; font-size: 1.2rem; font-weight: bold; color: #aaa; cursor: pointer; }
        .preview-tab.active { background: #00d4ff; color: #000; border-color: #00d4ff; }
        .preview-info { font-size: 1.4rem; text-align: center; color: #eee; padding: 15px; background: #000; border-radius: 5px; border: 1px solid #444; font-weight: bold;}
        .preview-actions { display: flex; gap: 15px; }
        .preview-btn { flex: 1; padding: 18px; text-align: center; font-size: 1.5rem; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .preview-btn.cancel { background: #555; color: #fff; border: 1px solid #777;}
        .preview-btn.start { background: #00d4ff; color: #000; box-shadow: 0 0 15px #00d4ff; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 地図画面（アプリ内完結型） -->
        <div id="mapScreen" class="map-screen dark-mode">
            <div id="map"></div>
            <div class="map-overlay-left">
                <div class="map-btn sound-btn" onclick="zoomInMap()">広域表示(＋)</div>
                <div class="map-btn sound-btn" onclick="zoomOutMap()">詳細表示(－)</div>
                <!-- ★ 新搭載：ヘディングアップ（進行方向上）切替ボタン -->
                <div class="map-btn sound-btn btn-active-mode" id="headingToggleBtn" onclick="toggleHeadingMode()" style="margin-top: 15px;">🧭 進行方向上</div>
                <div class="map-btn sound-btn" onclick="requestDeviceOrientation()" id="compassBtn" style="margin-top: 8px;">センサー許可</div>
            </div>
        </div>

        <div id="routePreview" class="route-preview">
            <div class="preview-header" id="previewTitle">目的地: ---</div>
            <div class="preview-tabs">
                <div class="preview-tab sound-btn active" id="tabToll" onclick="selectRouteMode('toll')">高速・有料優先</div>
                <div class="preview-tab sound-btn" id="tabLocal" onclick="selectRouteMode('local')">一般道優先</div>
            </div>
            <div class="preview-info" id="previewInfo">距離: -- km | 時間: 約 -- 分 | 料金: -- 円</div>
            <div class="preview-actions">
                <div class="preview-btn sound-btn cancel" onclick="stopGuidance()">キャンセル</div>
                <div class="preview-btn sound-btn start" onclick="startGuidance()">🏁 案内開始</div>
            </div>
        </div>

        <div id="navModal" class="system-modal">
            <div class="modal-header">🧭 ナビゲーションメニュー</div>
            
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="名称 または 住所・番地 (例: トヨタ博物館, 北栄4-9-1)...">
                <button class="search-btn sound-btn" onclick="smartSearchLocation()">🔍 検索</button>
            </div>

            <div class="modal-btn sound-btn" onclick="findPOIs()"><span class="modal-icon">🏪</span>現在地周辺の コンビニ・GS</div>
            <div class="modal-btn sound-btn" onclick="goHome()"><span class="modal-icon">🏠</span>自宅へ帰る（宮野木町）</div>
            <div class="modal-btn sound-btn" onclick="stopGuidance()"><span class="modal-icon">🛑</span>ルート案内 ストップ</div>
            <div class="modal-close sound-btn" onclick="closeModal('navModal')">閉じる</div>
        </div>

        <div id="resultsModal" class="system-modal">
            <div class="modal-header">📍 検索結果（現在地から近い順）</div>
            <div id="resultsListContainer" class="results-list-container"></div>
            <div class="modal-close sound-btn" onclick="backToNavMenu()">🔙 メニューに戻る</div>
        </div>

        <div id="settingsModal" class="system-modal">
            <div class="modal-header settings-header">⚙ システム設定</div>
            <div class="modal-btn sound-btn settings-btn" onclick="toggleMapMode()"><span class="modal-icon">🌙</span>地図 昼/夜 切替</div>
            <div class="modal-btn sound-btn settings-btn" id="voiceBtn" onclick="toggleVoice()"><span class="modal-icon">🗣️</span>音声案内：ON</div>
            <div class="modal-close sound-btn" onclick="closeModal('settingsModal')">閉じる</div>
        </div>

        <!-- 下部ハードウェアパネル -->
        <div class="hardware-panel">
            <div class="hw-btn sound-btn" onclick="showToast('◀◀')">⏮</div>
            <div class="hw-btn sound-btn" onclick="showToast('▶▶')">⏭</div>
            <div class="hw-btn sound-btn" onclick="showToast('地点登録完了')">★</div>
            <div class="hw-btn sound-btn hw-btn-text" onclick="showToast('ソース切替 (ダミー)')">AV</div>
            
            <div class="hw-btn sound-btn neon-blue" style="font-size: 1.5rem;" onclick="openYouTubeMusic()">♪</div>
            <div class="hw-btn sound-btn neon-blue" style="font-size: 1.3rem;" onclick="openNavMenu()">▲<br><span style="font-size:0.5rem; position:absolute; top:8px;">◯</span></div>
            
            <div class="hw-btn sound-btn hw-btn-text" onclick="resetCamera()">現在地</div>
            <div class="hw-btn sound-btn" style="font-size: 1.5rem;" onclick="openModal('settingsModal')">⚙</div>
            
            <div class="hw-btn sound-btn" onclick="changeVolume(-1)">－</div>
            <div class="hw-btn sound-btn" onclick="changeVolume(1)">＋</div>
        </div>
    </div>
    <div id="toast">通知メッセージ</div>

    <script>
        let wakeLock = null;
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') await requestWakeLock();
        });
        requestWakeLock();

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = new AudioContext();
        function unlockAudio() { if(audioCtx.state === 'suspended') audioCtx.resume(); }
        document.body.addEventListener('touchstart', unlockAudio, { capture: true, passive: true });
        document.body.addEventListener('click', unlockAudio, { capture: true, passive: true });

        function playBeep() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(2000, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);     
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        window.onload = function() {
            const buttons = document.querySelectorAll('.sound-btn');
            buttons.forEach(function(btn) {
                btn.addEventListener('pointerdown', function() { playBeep(); });
                btn.addEventListener('touchstart', function() { playBeep(); }, {passive: true});
            });
        }

        function openYouTubeMusic() {
            showToast('🎵 YouTube Musicを起動します');
            speak('ユーチューブミュージックを開きます');
            setTimeout(() => { window.location.href = 'youtubemusic://'; setTimeout(() => { window.location.href = 'https://music.youtube.com'; }, 1000); }, 500);
        }

        let appVolume = 1.0; 
        function changeVolume(direction) {
            if (direction > 0) {
                if (appVolume === 0) appVolume = 0.5; else appVolume = 1.0;
                showToast('🔊 音量: 大 (MAX)'); speak('音量を大きくしました');
            } else {
                if (appVolume === 1.0) appVolume = 0.5; else appVolume = 0;
                if (appVolume === 0) { showToast('🔇 音声案内: ミュート'); } else { showToast('🔉 音量: 中'); speak('音量を下げました'); }
            }
        }

        let voiceGuidance = true;
        function speak(text) {
            if(!voiceGuidance || appVolume === 0) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ja-JP'; msg.rate = 1.05; msg.volume = appVolume;
            window.speechSynthesis.speak(msg);
        }

        function toggleVoice() {
            voiceGuidance = !voiceGuidance;
            const btn = document.getElementById('voiceBtn');
            if(voiceGuidance) {
                btn.innerHTML = '<span class="modal-icon">🗣️</span>音声案内：ON'; showToast('🗣️ 音声案内をオンにしました'); speak('音声案内をオンにしました');
            } else {
                btn.innerHTML = '<span class="modal-icon">🔇</span>音声案内：OFF'; showToast('🔇 音声案内をオフにしました');
            }
        }

        // --- 地図エンジンのセットアップ ---
        var map = L.map('map', { zoomControl: false }).setView([35.6074, 140.1065], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        var userLat = 35.6074; var userLng = 140.1065; 
        var isTracking = true;
        let isHeadingUp = true; // デフォルトでヘディングアップ（進行方向上）モード
        let lastHeading = 0;

        var naviIcon = L.divIcon({ className: 'navi-marker-icon', html: '<div id="navi-arrow" class="navi-arrow"></div>', iconSize: [40, 40], iconAnchor: [20, 20] });
        var userMarker = L.marker([userLat, userLng], {icon: naviIcon}).addTo(map);

        // ★ リルート用データ保管
        let destLatObj = null; let destLngObj = null; let destNameObj = '';
        let routeLineCoords = []; 
        let offRouteCount = 0; let isRecalculating = false;

        // ★ 自動リルート計算（ルートからの距離算出）
        function distToSegmentSquared(p, v, w) {
            let l2 = Math.pow(v.lng - w.lng, 2) + Math.pow(v.lat - w.lat, 2);
            if (l2 === 0) return Math.pow(p.lng - v.lng, 2) + Math.pow(p.lat - v.lat, 2);
            let t = ((p.lng - v.lng) * (w.lng - v.lng) + (p.lat - v.lat) * (w.lat - v.lat)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.pow(p.lng - (v.lng + t * (w.lng - v.lng)), 2) + Math.pow(p.lat - (v.lat + t * (w.lat - v.lat)), 2);
        }
        function getDistToRouteKM(lat, lng) {
            if(!routeLineCoords || routeLineCoords.length < 2) return 0;
            let p = {lat: lat, lng: lng};
            let minDistSq = Infinity;
            for(let i=0; i < routeLineCoords.length - 1; i++) {
                let v = {lat: routeLineCoords[i][1], lng: routeLineCoords[i][0]};
                let w = {lat: routeLineCoords[i+1][1], lng: routeLineCoords[i+1][0]};
                let dSq = distToSegmentSquared(p, v, w);
                if(dSq < minDistSq) minDistSq = dSq;
            }
            return Math.sqrt(minDistSq) * 111; // 1度 ≒ 111kmとして簡易計算
        }

        // GPS監視ループ
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                userLat = position.coords.latitude; 
                userLng = position.coords.longitude;
                userMarker.setLatLng([userLat, userLng]);
                
                if(isTracking) map.setView([userLat, userLng]);
                if (position.coords.heading !== null) updateArrowRotation(position.coords.heading);

                // ★ リルート判定（案内中のみ実行）
                if (isRouting && !isRecalculating && destLatObj !== null) {
                    let distKM = getDistToRouteKM(userLat, userLng);
                    if (distKM > 0.05) { // 50m以上ルートから外れたら
                        offRouteCount++;
                        if (offRouteCount >= 2) { // 連続2回で外れたらリルート発動
                            triggerReroute();
                        }
                    } else {
                        offRouteCount = 0; // ルート上ならカウントリセット
                    }
                }
            }, function(error) {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
        }

        // ★ 新機能：進行方向（ヘディングアップ）と北上（ノースアップ）の切替
        function toggleHeadingMode() {
            isHeadingUp = !isHeadingUp;
            let btn = document.getElementById('headingToggleBtn');
            if(isHeadingUp) {
                btn.innerHTML = '🧭 進行方向上';
                btn.classList.add('btn-active-mode');
                showToast('マップを「進行方向上」にしました');
                updateArrowRotation(lastHeading);
            } else {
                btn.innerHTML = '🧭 北を上 (固定)';
                btn.classList.remove('btn-active-mode');
                showToast('マップを「北を上」にしました');
                document.getElementById('map').style.transform = `rotate(0deg)`;
                updateArrowRotation(lastHeading);
            }
        }

        // 矢印とマップ自体の回転ロジック
        function updateArrowRotation(degree) {
            lastHeading = degree;
            var arrowElement = document.getElementById('navi-arrow');
            var mapElement = document.getElementById('map');
            
            if (isHeadingUp && isTracking) {
                // 地図全体をマイナス方向に回転させて、進行方向を真上にする
                mapElement.style.transform = `rotate(${-degree}deg)`;
                if (arrowElement) arrowElement.style.transform = `rotate(${degree}deg)`; // 矢印は相殺して画面上を向く
            } else {
                mapElement.style.transform = `rotate(0deg)`; // 地図は北上
                if (arrowElement) arrowElement.style.transform = `rotate(${degree}deg)`; // 矢印だけ回る
            }
        }

        function requestDeviceOrientation() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') { window.addEventListener('deviceorientation', handleOrientation, false); document.getElementById('compassBtn').style.display='none';}
                }).catch(console.error);
            } else { window.addEventListener('deviceorientation', handleOrientation, false); document.getElementById('compassBtn').style.display='none';}
        }
        function handleOrientation(event) {
            var heading = event.webkitCompassHeading ? event.webkitCompassHeading : (event.alpha ? 360 - event.alpha : 0);
            updateArrowRotation(heading);
        }

        // 手で地図を触ったときは回転をリセット（ノースアップのスクロールモード）
        map.on('dragstart', function() { 
            isTracking = false; 
            document.getElementById('map').style.transform = `rotate(0deg)`;
        });
        
        function resetCamera() { 
            isTracking = true; 
            isRouting = false; 
            map.setView([userLat, userLng], 16); 
            showToast('📍 現在地にフォーカスしました'); 
            updateArrowRotation(lastHeading);
        }
        function zoomInMap() { map.zoomIn(); }
        function zoomOutMap() { map.zoomOut(); }
        
        function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
        function openNavMenu() { openModal('navModal'); }
        function backToNavMenu() { closeModal('resultsModal'); openModal('navModal'); }

        var isDarkMode = true;
        function toggleMapMode() {
            closeModal('settingsModal');
            var mapScreen = document.getElementById('mapScreen');
            if (isDarkMode) { mapScreen.classList.remove('dark-mode'); showToast('🌞 昼間モード'); } else { mapScreen.classList.add('dark-mode'); showToast('🌙 夜間モード'); }
            isDarkMode = !isDarkMode;
        }

        var routeLayer = null; var destinationMarker = null; var poiMarkers = []; var isRouting = false;
        let currentRouteDist = 0; let currentRouteTime = 0; let currentRouteDest = ''; let currentRouteMode = 'toll';

        function calculateDistance(lat1, lon1, lat2, lon2) {
            var R = 6371; var dLat = (lat2 - lat1) * Math.PI / 180; var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); return R * c;
        }

        function smartSearchLocation() {
            var rawKeyword = document.getElementById('searchInput').value.trim();
            if(!rawKeyword) return;
            showToast('AI検索エンジンで解析中...');
            
            let hasNumbers = /[0-9０-９]/.test(rawKeyword);
            if (hasNumbers) {
                let gsiUrl = `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(rawKeyword)}`;
                fetch(gsiUrl).then(res => res.json()).then(data => {
                    if(data && data.length > 0) {
                        let results = data.map(item => {
                            let lon = item.geometry.coordinates[0]; let lat = item.geometry.coordinates[1]; let title = item.properties.title;
                            return { lat: lat, lon: lon, name: title, display_name: title + ' (高精度番地)', dist: calculateDistance(userLat, userLng, lat, lon) };
                        });
                        processMapResults(results, rawKeyword);
                    } else { fallbackToNominatim(rawKeyword); }
                }).catch(e => fallbackToNominatim(rawKeyword));
            } else { fallbackToNominatim(rawKeyword); }
        }

        function fallbackToNominatim(query) {
            let searchUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=jp&limit=25`;
            fetch(searchUrl).then(res => res.json()).then(data => {
                if(data.length > 0) {
                    let results = data.map(item => { return { lat: item.lat, lon: item.lon, name: item.display_name.split(',')[0], display_name: item.display_name, dist: calculateDistance(userLat, userLng, item.lat, item.lon) }; });
                    processMapResults(results, query);
                } else { showToast('目的地が見つかりませんでした'); speak('目的地が見つかりませんでした。'); }
            }).catch(err => { showToast('通信エラーが発生しました'); });
        }

        function processMapResults(dataArray, customTitle) {
            dataArray.sort((a, b) => a.dist - b.dist);
            let listHtml = '';
            dataArray.forEach((item) => {
                let shortName = item.name; let fullName = item.display_name;
                listHtml += `
                    <div class="result-item sound-btn" onclick="selectSearchResult(${item.lat}, ${item.lon}, '${shortName.replace(/'/g, "")}')">
                        <div class="result-name">📍 ${shortName}<br><span style="font-size:0.85rem; color:#aaa; font-weight:normal;">${fullName}</span></div>
                        <div class="result-dist">約 ${item.dist.toFixed(1)} km</div>
                    </div>`;
            });
            closeModal('navModal'); document.getElementById('resultsListContainer').innerHTML = listHtml; openModal('resultsModal');
            showToast(dataArray.length + '件見つかりました'); speak('候補が見つかりました。選択してください。');
        }

        function selectSearchResult(lat, lon, name) { closeModal('resultsModal'); startRoute(lat, lon, name); }

        function startRoute(destLat, destLng, destName) {
            stopGuidance(true); 
            destLatObj = destLat; destLngObj = destLng; destNameObj = destName;
            destinationMarker = L.marker([destLat, destLng]).addTo(map).bindPopup('🏁 ' + destName).openPopup();
            showToast('ルート探索中...');
            
            var primaryUrl = `https://router.project-osrm.org/route/v1/driving/${userLng},${userLat};${destLng},${destLat}?overview=full&geometries=geojson`;
            fetch(primaryUrl).then(res => res.json()).then(data => { processRouteData(data, destName, false); })
            .catch(err => {
                var backupUrl = `https://routing.openstreetmap.de/routed-car/route/v1/driving/${userLng},${userLat};${destLng},${destLat}?overview=full&geometries=geojson`;
                fetch(backupUrl).then(res => res.json()).then(data => { processRouteData(data, destName, false); })
                .catch(fallbackErr => { showToast('ルート検索に失敗しました'); speak('ルート計算に失敗しました'); });
            });
        }

        // ★ 自動リルート実行
        function triggerReroute() {
            isRecalculating = true;
            offRouteCount = 0;
            showToast('ルートを外れました。再探索します...');
            speak('ルートを外れました。リルートします。');
            
            var url = `https://router.project-osrm.org/route/v1/driving/${userLng},${userLat};${destLngObj},${destLatObj}?overview=full&geometries=geojson`;
            fetch(url).then(res => res.json()).then(data => {
                if(routeLayer) map.removeLayer(routeLayer);
                processRouteData(data, destNameObj, true); // true = リルートモード
                isRecalculating = false;
            }).catch(err => { isRecalculating = false; });
        }

        function processRouteData(data, destName, isReroute) {
            if(data.routes && data.routes.length > 0) {
                var routeGeoJSON = data.routes[0].geometry;
                routeLineCoords = routeGeoJSON.coordinates; // リルート計算用に保存
                routeLayer = L.geoJSON(routeGeoJSON, { style: {color: '#00d4ff', weight: 8, opacity: 0.8} }).addTo(map);
                
                currentRouteDist = data.routes[0].distance / 1000;
                currentRouteTime = Math.round(data.routes[0].duration / 60);
                currentRouteDest = destName;
                
                if (!isReroute) {
                    map.fitBounds(routeLayer.getBounds(), {padding: [50, 50]});
                    document.getElementById('previewTitle').innerText = '目的地: ' + destName;
                    selectRouteMode('toll'); 
                    document.getElementById('routePreview').classList.add('show');
                } else {
                    // リルートの場合はプレビュー画面を出さずにそのまま案内を継続
                    selectRouteMode(currentRouteMode); // 距離表示だけ更新
                    map.setView([userLat, userLng], 16);
                }
            } else if (!isReroute) {
                showToast('ルートが見つかりませんでした'); speak('ルートが見つかりませんでした');
            }
        }

        function selectRouteMode(mode) {
            currentRouteMode = mode;
            document.getElementById('tabToll').classList.remove('active'); document.getElementById('tabLocal').classList.remove('active');
            let timeMin = currentRouteTime; let costText = "無料";
            if(mode === 'toll') {
                document.getElementById('tabToll').classList.add('active');
                if(currentRouteDist > 5) { costText = `約 ${Math.floor((150 + (currentRouteDist * 24.6)) / 10) * 10} 円`; }
            } else {
                document.getElementById('tabLocal').classList.add('active'); costText = "無料 (一般道)"; timeMin = Math.round(timeMin * 1.5);
            }
            document.getElementById('previewInfo').innerText = `距離: ${currentRouteDist.toFixed(1)} km | 時間: 約 ${timeMin} 分 | 料金: ${costText}`;
        }

        function startGuidance() {
            document.getElementById('routePreview').classList.remove('show');
            isRouting = true; isTracking = true; offRouteCount = 0;
            map.setView([userLat, userLng], 16);
            let timeMin = currentRouteMode === 'local' ? Math.round(currentRouteTime * 1.5) : currentRouteTime;
            speak(`ルート案内を開始します。目的地まで、約 ${Math.round(currentRouteDist)}キロ、時間は ${timeMin}分です。`);
            showToast('🏁 案内を開始しました');
            updateArrowRotation(lastHeading); // 案内開始と同時にヘディングアップ適用
        }

        function goHome() { closeModal('navModal'); startRoute(35.6560, 140.1030, '自宅'); }

        function stopGuidance(silent = false) {
            if(!silent) { closeModal('navModal'); closeModal('resultsModal'); }
            document.getElementById('routePreview').classList.remove('show');
            if(routeLayer) map.removeLayer(routeLayer);
            if(destinationMarker) map.removeLayer(destinationMarker);
            destLatObj = null; destLngObj = null; routeLineCoords = [];
            isRouting = false; offRouteCount = 0;
            if(!silent) { showToast('🛑 案内を終了しました'); resetCamera(); }
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById("toast"); toast.innerText = message; toast.className = "show";
            clearTimeout(toastTimeout); toastTimeout = setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3500);
        }
    </script>
</body>
</html>
