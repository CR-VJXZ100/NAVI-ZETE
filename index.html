<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>純正風カーナビ - Leaflet版</title>
    <!-- 軽量で確実な地図エンジン (Leaflet) を読み込み -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; background-color: #050505; color: #fff; overflow: hidden; user-select: none; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        /* マップ表示エリア */
        .map-screen { flex: 1; position: relative; border-bottom: 4px solid #111; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        /* マップの色を反転させてダークテーマ風にする裏技 */
        .leaflet-tile { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        
        .map-overlay-left { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; flex-direction: column; gap: 5px; }
        .map-btn { background: rgba(30, 30, 30, 0.85); border: 1px solid #555; color: white; padding: 10px 15px; font-size: 1rem; border-radius: 4px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); cursor: pointer; }
        .map-btn:active { background: rgba(0, 0, 0, 0.9); }
        
        /* 下部ボタンパネル */
        .hardware-panel { height: 90px; background: linear-gradient(to bottom, #2b2b2b 0%, #151515 50%, #0a0a0a 100%); border-top: 2px solid #444; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 20; }
        .hw-btn { background: linear-gradient(to bottom, #111 0%, #222 100%); border: 1px solid #000; border-top: 1px solid #444; color: #ccc; height: 55px; min-width: 65px; margin: 0 4px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; box-shadow: 0 4px 5px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.2); cursor: pointer; position: relative; }
        .hw-btn:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.8), inset 0 2px 4px rgba(0,0,0,0.9); color: #fff; }
        .hw-btn-text { font-size: 0.9rem; padding: 0 15px; }
        .neon-blue { color: #e0f7ff; text-shadow: 0 0 5px #00d4ff, 0 0 10px #008cff, 0 0 20px #0044ff, 0 0 30px #0022cc; }
        .hw-btn::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 30px; height: 2px; background-color: #ff3333; box-shadow: 0 0 3px #ff0000; opacity: 0.7; }
        .neon-blue::after { background-color: #008cff; box-shadow: 0 0 3px #008cff; }
        
        #toast { visibility: hidden; min-width: 250px; background-color: rgba(0, 0, 0, 0.8); color: #fff; text-align: center; border-radius: 30px; padding: 15px; position: fixed; z-index: 100; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 1.2rem; border: 1px solid #444; box-shadow: 0 5px 15px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 140px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="map-screen">
            <div id="map"></div>
            <div class="map-overlay-left">
                <div class="map-btn" onclick="map.zoomIn()">広域表示(＋)</div>
                <div class="map-btn" onclick="map.zoomOut()">詳細表示(－)</div>
                <div class="map-btn" style="margin-top: 15px;" onclick="resetCamera()">ON 》</div>
            </div>
        </div>
        <div class="hardware-panel">
            <div class="hw-btn" onclick="showToast('前の曲へスキップ')">⏮</div>
            <div class="hw-btn" onclick="showToast('次の曲へスキップ')">⏭</div>
            <div class="hw-btn" onclick="showToast('お気に入りに登録しました')">★</div>
            <div class="hw-btn hw-btn-text" onclick="showToast('AVソース切り替え画面')">AV</div>
            <div class="hw-btn neon-blue" style="font-size: 1.5rem;" onclick="showToast('🎵 音楽プレーヤーを起動')">♪</div>
            <div class="hw-btn neon-blue" style="font-size: 1.3rem;" onclick="showToast('🧭 ナビゲーションメニューを起動')">▲<br><span style="font-size:0.5rem; position:absolute; top:8px;">◯</span></div>
            <div class="hw-btn hw-btn-text" onclick="resetCamera()">現在地</div>
            <div class="hw-btn" style="font-size: 1.5rem;" onclick="showToast('システム設定')">⚙</div>
            <div class="hw-btn" onclick="showToast('音量を下げました')">－</div>
            <div class="hw-btn" onclick="showToast('音量を上げました')">＋</div>
        </div>
    </div>
    <div id="toast">通知メッセージ</div>

    <script>
        // 千葉市周辺の座標
        const currentLat = 35.6074;
        const currentLng = 140.1065;

        // 地図の初期化
        const map = L.map('map', {
            zoomControl: false // デフォルトのズームボタンを非表示
        }).setView([currentLat, currentLng], 14);

        // トークン不要のオープンストリートマップを使用
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 現在地マーカーを追加
        const marker = L.marker([currentLat, currentLng]).addTo(map);
        marker.bindPopup("<b>現在地周辺</b>").openPopup();

        // カメラリセット機能
        function resetCamera() {
            map.setView([currentLat, currentLng], 14);
            showToast('📍 現在地周辺にフォーカスしました');
        }

        // トースト通知機能
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "show";
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 2500);
        }
    </script>
</body>
</html>
